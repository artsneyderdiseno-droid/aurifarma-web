  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: radial-gradient(circle at 50% 30%, var(--mist), #fff 60%); color: var(--ink); font: 500 1rem/1.6 "Manrope", system-ui, sans-serif; text-align: center; }

  img { width: 120px; height: auto; margin-bottom: 18px; animation: float 6s ease-in-out infinite; }

  a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 26px; border-radius: 999px; font-weight: 700; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; transition: transform .25s, box-shadow .25s; }
  a.btn:hover { transform: translateY(-2px); }
  .btn--primary { background: var(--navy); color: #fff; box-shadow: 0 14px 30px -12px rgba(15, 30, 45, .55); }
  .btn--wa { background: var(--wa); color: #06301a; }
  a.btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } a.btn { transition: none; } }
